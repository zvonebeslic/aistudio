name: Sync root website to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - index.html
      - editor.html
      - video.html
      - app.js
      - style.css
      - tools.css
      - cloud.js
      - storage.js
      - photo-editor.js
      - video-editor.js
      - .nojekyll
      - scripts/sync-pages.mjs
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sync-root-to-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update docs/ from root files
        run: node scripts/sync-pages.mjs
      - name: Commit published copies if changed
        id: sync_commit
        run: |
          git add docs
          if git diff --cached --quiet; then
            echo "Already in sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync GitHub Pages from root HTML CSS JS"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request a fresh GitHub Pages build
        if: steps.sync_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
